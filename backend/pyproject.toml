[project]
name = "trail-penasagra-api"
version = "0.1.0"
description = "API de Trail Peñasagra — Corremos por Adriana"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165,<0.166",
    "uvicorn[standard]>=0.54,<0.55",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.3,<3.4",
    "alembic>=1.20,<1.21",
    "pydantic>=2.14,<2.15",
    "pydantic-settings>=2.16,<2.17",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<9.3",
    "httpx>=0.28,<0.29",
    "ruff>=0.17,<0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
