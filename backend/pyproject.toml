[project]
name = "trail-penasagra-api"
version = "0.1.0"
description = "API de Trail Peñasagra — Corremos por Adriana"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165,<0.166",
    "uvicorn[standard]>=0.54,<0.55",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.3,<3.4",
    "alembic>=1.20,<1.21",
    "pydantic>=2.14,<2.15",
    "pydantic-settings>=2.16,<2.17",
    "argon2-cffi>=25.1,<25.2",
    "boto3>=1.44,<1.45",
    "python-multipart>=0.0.34,<0.1",
    "defusedxml>=0.7.1,<0.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<9.3",
    "httpx>=0.28,<0.29",
    "ruff>=0.17,<0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# Patrón idiomático de FastAPI para dependencias.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Contraseñas de prueba ficticias, procesos hijo y SQL de comprobación en las pruebas.
"tests/*" = ["S105", "S106", "S603", "S608"]
