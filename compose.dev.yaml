# Complemento SOLO para desarrollo local:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
# Publica la API y PostgreSQL únicamente en 127.0.0.1 (para `npm run dev` y herramientas
# locales) y define el servicio de pruebas `api-test` (perfil `test`).
services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT_LOCAL:-5432}:5432"

  api:
    ports:
      - "127.0.0.1:${API_PORT_LOCAL:-8000}:8000"
    environment:
      # Servidor de desarrollo de Vite (npm run dev)
      ORIGENES_PERMITIDOS: ${ORIGENES_PERMITIDOS:-http://localhost:5173}

  # Servicio compatible con S3 para desarrollo y pruebas (moto). Sin credenciales reales.
  s3-dev:
    image: motoserver/moto:5.2.5
    profiles: [test, s3]
    networks: [interna]

  api-test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      S3_TEST_ENDPOINT_URL: http://s3-dev:5000
      S3_TEST_BUCKET: trail-media-pruebas
      S3_TEST_ACCESS_KEY_ID: prueba
      S3_TEST_SECRET_ACCESS_KEY: prueba
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trail}:${POSTGRES_PASSWORD:-trail_dev}@db:5432/${POSTGRES_DB:-trail}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      ENTORNO: desarrollo
    depends_on:
      db:
        condition: service_healthy
      s3-dev:
        condition: service_started
    networks: [interna]
