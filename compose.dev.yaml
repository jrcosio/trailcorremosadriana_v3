# Complemento SOLO para desarrollo local:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
# Publica la API y PostgreSQL únicamente en 127.0.0.1 (para `npm run dev` y herramientas
# locales) y define el servicio de pruebas `api-test` (perfil `test`).
services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT_LOCAL:-5432}:5432"

  api:
    ports:
      - "127.0.0.1:${API_PORT_LOCAL:-8000}:8000"

  api-test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trail}:${POSTGRES_PASSWORD:-trail_dev}@db:5432/${POSTGRES_DB:-trail}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      ENTORNO: desarrollo
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]
