openapi: 3.1.0
info: { title: Trail Peñasagra API — noticias (feature 007), version: 0.7.0 }
paths:
  /api/admin/noticias/{id}:
    put:
      summary: Crear o actualizar (Origin → sesión → CSRF; 409 por versión)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                category: { type: string, maxLength: 60 }
                date: { type: string, description: "'' o AAAA-MM-DD" }
                image: { type: string, description: regla de referencias }
                excerpt: { type: string, maxLength: 500 }
                body: { type: string, minLength: 1, maxLength: 50000 }
                published: { type: boolean }
                version: { type: integer, minimum: 0 }
      responses: { "200": { description: Item privado }, "400": { description: Campo no válido }, "409": { description: Conflicto } }
    delete:
      parameters: [{ name: version, in: query, required: true, schema: { type: integer } }]
      responses: { "200": { description: Borrada }, "404": { description: No existe }, "409": { description: Conflicto } }
